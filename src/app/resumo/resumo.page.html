<ion-header>
  <ion-toolbar color="success">
    <ion-title>Recicla IF</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="voltar()">voltar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item lines="none">
    <ion-label>Pontos da semana</ion-label>
    <ion-note slot="end">{{ resumo.pontosSemana }}</ion-note>
  </ion-item>
  <ion-item lines="none">
    <ion-label><strong>Meta semanal</strong></ion-label>
    <ion-note slot="end"><strong>{{ resumo.metaSemanal }}</strong></ion-note>
  </ion-item>

  <ion-item lines="none" [color]="metaAtingida ? 'success' : 'danger'">
    <ion-label>{{ metaAtingida ? 'Meta atingida!' : 'Meta ainda não atingida' }}</ion-label>
  </ion-item>

  @if (item) {
    <ion-item>
      <ion-label>{{ item.nome }}</ion-label>
      <ion-note slot="end">+{{ item.pontos }}</ion-note>
    </ion-item>
  }

  <ion-button expand="block" color="success" class="ion-margin-top" (click)="registrar()">
    Registrar entrega
  </ion-button>
</ion-content>
