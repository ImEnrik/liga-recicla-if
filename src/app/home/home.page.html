<ion-header>
  <ion-toolbar color="success">
    <ion-title>Liga Recicla IF</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (item of itens; track item.id) {
      <ion-item>
        <ion-label>
          <h2>{{ item.nome }}</h2>
          <p>{{ item.tipo }} · {{ item.quantidade }} un · {{ item.pontos }} pts</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
