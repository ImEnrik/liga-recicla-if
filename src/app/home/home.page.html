<ion-header>
  <ion-toolbar color="success">
    <ion-title>Recicla IF</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="sair()">sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-searchbar
    placeholder="Buscar item"
    [value]="svc.busca()"
    (ionInput)="svc.filtrar($any($event).target.value)"
  ></ion-searchbar>

  <ion-list>
    @for (item of svc.itensFiltrados(); track item.id) {
      <ion-item button detail="false" (click)="svc.selecionar(item)"
                [color]="svc.estaSelecionado(item) ? 'light' : ''">
        <ion-label>
          <h2>{{ item.nome }}</h2>
          <p>+{{ item.pontos }} pts</p>
        </ion-label>
        <ion-button slot="end" size="small" fill="clear">
          {{ svc.estaSelecionado(item) ? '✓' : '+' }}
        </ion-button>
      </ion-item>
    }
  </ion-list>

  <ion-button expand="block" color="success" (click)="continuar()">Continuar</ion-button>
</ion-content>
